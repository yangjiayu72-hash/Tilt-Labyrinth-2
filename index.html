<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Tilt Labyrinth</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="container"></div>
    <div id="instructions">
        <h2>3D Multi-Layer Maze</h2>
        <p>Drag the mouse to tilt the maze and guide the ball.</p>
        <p id="level-counter">Current Layer: 1 / 5</p>
        <p class="hint">Navigate through holes to reach lower layers!</p>
        <button id="reset-btn" class="reset-button">Reset</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="labyrinth.js"></script>
    <script src="sphere.js"></script>
    <script src="main.js"></script>
</body>
</html>
